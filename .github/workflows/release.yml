name: Release

on:
  release:
    types: [published, unpublished]

permissions:
  contents: write

env:
  BIOME_VERSION: 2.5.11

jobs:
  build-binaries:
    name: Build Binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: "latest"

      - name: Setup Mask
        uses: taiki-e/install-action@v2
        with:
          tool: mask

      - name: Cache Biome
        id: cache-biome
        uses: actions/cache@v4
        with:
          path: /usr/local/bin/biome
          key: biome-${{ env.BIOME_VERSION }}-linux-x64
          restore-keys: biome-${{ env.BIOME_VERSION }}-

      - name: Install Biome
        if: steps.cache-biome.outputs.cache-hit != 'true'
        run: |
          curl -L https://github.com/biomejs/biome/releases/download/%40biomejs%2Fbiome%40${{ env.BIOME_VERSION }}/biome-linux-x64 -o biome
          chmod +x biome
          sudo mv biome /usr/local/bin/biome

      - name: Build binaries
        run: mask release

      - name: Upload Binaries
        uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: bin/
          retention-days: 7

  build-installer:
    name: Build Installer
    needs: build-binaries
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          name: binaries
          path: bin/

      - name: Install NSIS
        run: choco install nsis -y

      - name: Build Installer
        run: |
          mkdir -p release
          & "C:\Program Files (x86)\NSIS\makensis.exe" installer\windows\commit-sage.nsi

      - name: Upload Installer
        uses: actions/upload-artifact@v4
        with:
          name: installer
          path: release/*.exe
          retention-days: 7

  build-dmg:
    name: Build macOS DMGs
    # create-dmg needs hdiutil, so this is the one job that must run on macOS.
    # Nothing is compiled here — the ubuntu job cross-compiles both archs and
    # this job only wraps the binaries, keeping paid macOS minutes to ~3 min.
    needs: build-binaries
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          name: binaries
          path: bin/

      - name: Install create-dmg
        run: brew list create-dmg &>/dev/null || brew install create-dmg

      - name: Build DMGs
        run: |
          TAG="${{ github.event.release.tag_name }}"
          mkdir -p dmg
          bash installer/macos/build-dmg.sh "${TAG#v}" dmg

      - name: Upload DMGs
        uses: actions/upload-artifact@v4
        with:
          name: dmg
          path: dmg/*.dmg
          retention-days: 7

  release:
    name: Create Release
    needs: [build-binaries, build-installer, build-dmg]
    runs-on: ubuntu-latest
    steps:
      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          name: binaries
          path: binaries

      - name: Download installer
        uses: actions/download-artifact@v4
        with:
          name: installer
          path: installer

      - name: Download DMGs
        uses: actions/download-artifact@v4
        with:
          name: dmg
          path: dmg

      - name: List files
        run: |
          echo "=== Binaries ==="
          ls -la binaries/
          echo "=== Installer ==="
          ls -la installer/
          echo "=== DMGs ==="
          ls -la dmg/

      - name: Create Release
        uses: softprops/action-gh-release@v2.0.0
        with:
          files: |
            binaries/commit-sage-linux-x64
            binaries/commit-sage-linux-arm64
            binaries/commit-sage-windows-x64.exe
            binaries/commit-sage-windows-arm64.exe
            binaries/commit-sage-macos-x64
            binaries/commit-sage-macos-arm64
            dmg/*.dmg
            installer/*.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
