name: Format

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  biome-format:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "latest"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Setup Mask
        uses: taiki-e/install-action@v2
        with:
          tool: mask

      - name: Run linting
        run: mask lint

      - name: Check installer version in sync
        # Fails the build if the NSIS version keys drift from package.json.
        # release-please bumps package.json on release; the installer must follow.
        run: mask sync-installer-version --check
